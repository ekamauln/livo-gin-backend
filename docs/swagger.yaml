basePath: /
definitions:
  controllers.AssignRoleRequest:
    properties:
      role_name:
        example: manager
        type: string
    required:
    - role_name
    type: object
  controllers.BulkCreateOrderRequest:
    properties:
      orders:
        items:
          $ref: '#/definitions/controllers.CreateOrderRequest'
        minItems: 1
        type: array
    required:
    - orders
    type: object
  controllers.BulkCreateOrderResponse:
    properties:
      created_orders:
        items:
          $ref: '#/definitions/models.OrderResponse'
        type: array
      failed_orders:
        items:
          $ref: '#/definitions/controllers.FailedOrder'
        type: array
      skipped_orders:
        items:
          $ref: '#/definitions/controllers.SkippedOrder'
        type: array
      summary:
        $ref: '#/definitions/controllers.BulkCreateSummary'
    type: object
  controllers.BulkCreateSummary:
    properties:
      created:
        type: integer
      failed:
        type: integer
      skipped:
        type: integer
      total:
        type: integer
    type: object
  controllers.CreateOrderDetailRequest:
    properties:
      product_name:
        example: Sample Product
        type: string
      quantity:
        example: 2
        minimum: 1
        type: integer
      sku:
        example: PROD001
        type: string
      variant:
        example: Red - Size M
        type: string
    required:
    - product_name
    - quantity
    - sku
    type: object
  controllers.CreateOrderRequest:
    properties:
      buyer:
        example: John Doe
        type: string
      channel:
        example: Shopee
        type: string
      courier:
        example: JNE
        type: string
      order_details:
        items:
          $ref: '#/definitions/controllers.CreateOrderDetailRequest'
        minItems: 1
        type: array
      order_id:
        example: 2509116GA36VM5
        type: string
      status:
        example: ready to pick
        type: string
      store:
        example: SP deParcelRibbon
        type: string
      tracking:
        example: JNE1234567890
        type: string
    required:
    - buyer
    - channel
    - order_details
    - order_id
    - store
    type: object
  controllers.CreateProductRequest:
    properties:
      barcode:
        type: string
      image:
        type: string
      location:
        type: string
      name:
        type: string
      sku:
        type: string
      variant:
        type: string
    required:
    - barcode
    - image
    - location
    - name
    - sku
    - variant
    type: object
  controllers.CreateUserRequest:
    properties:
      email:
        example: john@example.com
        type: string
      full_name:
        example: John Doe
        type: string
      initial_role:
        example: picker
        type: string
      is_active:
        example: true
        type: boolean
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: john_doe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  controllers.FailedOrder:
    properties:
      error:
        type: string
      index:
        type: integer
      order_id:
        type: string
    type: object
  controllers.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: john_doe
        type: string
    required:
    - password
    - username
    type: object
  controllers.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/models.UserResponse'
    type: object
  controllers.MobileOrderDetailResponse:
    properties:
      buyer:
        type: string
      channel:
        type: string
      courier:
        type: string
      created_at:
        type: string
      id:
        type: integer
      order_details:
        items:
          $ref: '#/definitions/controllers.MobileOrderDetailWithProduct'
        type: array
      order_id:
        type: string
      picked_at:
        type: string
      picked_by:
        type: string
      status:
        type: string
      store:
        type: string
      tracking:
        type: string
      updated_at:
        type: string
    type: object
  controllers.MobileOrderDetailWithProduct:
    properties:
      barcode:
        type: string
      id:
        type: integer
      location:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      variant:
        type: string
    type: object
  controllers.MobileOrderListResponse:
    properties:
      buyer:
        type: string
      channel:
        type: string
      courier:
        type: string
      created_at:
        type: string
      id:
        type: integer
      order_details:
        items:
          $ref: '#/definitions/controllers.MobileOrderDetailWithProduct'
        type: array
      order_id:
        type: string
      picked_at:
        type: string
      picked_by:
        type: string
      status:
        type: string
      store:
        type: string
      tracking:
        type: string
      updated_at:
        type: string
    type: object
  controllers.MobileOrdersListResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/controllers.MobileOrderListResponse'
        type: array
      pagination:
        $ref: '#/definitions/controllers.PaginationResponse'
    type: object
  controllers.OrderDetailResponse:
    properties:
      id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      variant:
        type: string
    type: object
  controllers.OrderDetailsOnlyResponse:
    properties:
      order_details:
        items:
          $ref: '#/definitions/controllers.OrderDetailResponse'
        type: array
      order_id:
        type: string
      tracking:
        type: string
    type: object
  controllers.OrdersListResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/models.OrderResponse'
        type: array
      pagination:
        $ref: '#/definitions/controllers.PaginationResponse'
    type: object
  controllers.PaginationResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  controllers.ProductsListResponse:
    properties:
      pagination:
        $ref: '#/definitions/controllers.PaginationResponse'
      products:
        items:
          $ref: '#/definitions/models.ProductResponse'
        type: array
    type: object
  controllers.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        example: john@example.com
        type: string
      full_name:
        example: John Doe
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: john_doe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  controllers.RemoveRoleRequest:
    properties:
      role_name:
        example: manager
        type: string
    required:
    - role_name
    type: object
  controllers.SkippedOrder:
    properties:
      index:
        type: integer
      order_id:
        type: string
      reason:
        type: string
    type: object
  controllers.UpdateOrderDetailRequest:
    properties:
      product_name:
        example: Updated Product
        type: string
      quantity:
        example: 3
        minimum: 1
        type: integer
      sku:
        example: PROD001
        type: string
      variant:
        example: Blue - Size L
        type: string
    required:
    - product_name
    - quantity
    - sku
    type: object
  controllers.UpdateProductRequest:
    properties:
      barcode:
        type: string
      image:
        type: string
      location:
        type: string
      name:
        type: string
      variant:
        type: string
    required:
    - barcode
    - image
    - location
    - name
    - variant
    type: object
  controllers.UpdateProfileRequest:
    properties:
      email:
        example: john@example.com
        type: string
      full_name:
        example: John Doe
        type: string
      password:
        example: newpassword123
        type: string
    type: object
  controllers.UpdateUserPasswordRequest:
    properties:
      new_password:
        example: newpassword123
        minLength: 6
        type: string
    required:
    - new_password
    type: object
  controllers.UpdateUserProfileRequest:
    properties:
      email:
        example: newemail@example.com
        type: string
      full_name:
        example: John Doe Updated
        minLength: 1
        type: string
    type: object
  controllers.UpdateUserStatusRequest:
    properties:
      is_active:
        example: true
        type: boolean
    type: object
  controllers.UsersListResponse:
    properties:
      pagination:
        $ref: '#/definitions/controllers.PaginationResponse'
      users:
        items:
          $ref: '#/definitions/models.UserResponse'
        type: array
    type: object
  models.OrderDetailResponse:
    properties:
      id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      variant:
        type: string
    type: object
  models.OrderResponse:
    properties:
      buyer:
        type: string
      channel:
        type: string
      courier:
        type: string
      created_at:
        type: string
      id:
        type: integer
      order_details:
        items:
          $ref: '#/definitions/models.OrderDetailResponse'
        type: array
      order_id:
        type: string
      picked_at:
        type: string
      picked_by:
        type: string
      status:
        type: string
      store:
        type: string
      tracking:
        type: string
      updated_at:
        type: string
    type: object
  models.ProductResponse:
    properties:
      barcode:
        type: string
      created_at:
        type: string
      id:
        type: integer
      image:
        type: string
      location:
        type: string
      name:
        type: string
      sku:
        type: string
      updated_at:
        type: string
      variant:
        type: string
    type: object
  models.Role:
    properties:
      created_at:
        type: string
      description:
        example: Administrator role
        type: string
      id:
        type: integer
      name:
        example: admin
        type: string
      updated_at:
        type: string
    type: object
  models.RoleResponse:
    properties:
      assigned_at:
        type: string
      assigned_by:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      roles:
        items:
          $ref: '#/definitions/models.RoleResponse'
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  utils.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: 192.168.31.136:8000
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: A comprehensive user management backend service with JWT authentication
    and role-based access control
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Livotech Backend Service API
  version: "1.0"
paths:
  /api/admin/roles:
    get:
      consumes:
      - application/json
      description: Get list of all available roles
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Role'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get all roles
      tags:
      - admin
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Get list of all users (admin only). Optional search by username
        or full name.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by username or full name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.UsersListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get all users with search capability
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Create a new user account (admin only)
      parameters:
      - description: Create user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - admin
  /api/admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user account (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Get specific user information (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - admin
  /api/admin/users/{id}/password:
    put:
      consumes:
      - application/json
      description: Update a user's password (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateUserPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Update user password
      tags:
