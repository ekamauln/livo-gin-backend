          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - admin
  /api/admin/users/{id}/roles:
    delete:
      consumes:
      - application/json
      description: Remove a role from a user (requires appropriate permissions)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Remove role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.RemoveRoleRequest'
      produces:
