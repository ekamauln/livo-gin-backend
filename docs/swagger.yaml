        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Remove role from user
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Assign a role to a user (requires appropriate permissions)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Assign role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UserResponse'
